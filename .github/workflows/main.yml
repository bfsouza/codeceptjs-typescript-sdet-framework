name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run API feature suite
        run: npm run test:api
      - name: Ensure allure results folder exists
        run: |
          mkdir -p output/allure-results
          if [ -z "$(ls -A output/allure-results)" ]; then
            touch output/allure-results/.placeholder
          fi
      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: output/allure-results
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run Web feature suite
        run: npm run test:web
      - name: Ensure allure results folder exists
        run: |
          mkdir -p output/allure-results
          if [ -z "$(ls -A output/allure-results)" ]; then
            touch output/allure-results/.placeholder
          fi
      - name: Upload Web Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web
          path: output/allure-results
          if-no-files-found: warn

  hybrid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run Hybrid feature suite
        run: npm run test:hybrid
      - name: Ensure allure results folder exists
        run: |
          mkdir -p output/allure-results
          if [ -z "$(ls -A output/allure-results)" ]; then
            touch output/allure-results/.placeholder
          fi
      - name: Upload Hybrid Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-hybrid
          path: output/allure-results
          if-no-files-found: warn

  allure-report:
    if: always()
    needs: [api, web, hybrid]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Check API artifact exists
        id: check_api
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo });
            const found = artifacts.data.artifacts.some(a => a.name === 'allure-results-api');
            core.setOutput('found', found ? 'true' : 'false');
      - name: Download API Allure results
        if: steps.check_api.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
      - name: Check Web artifact exists
        id: check_web
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo });
            const found = artifacts.data.artifacts.some(a => a.name === 'allure-results-web');
            core.setOutput('found', found ? 'true' : 'false');
      - name: Download Web Allure results
        if: steps.check_web.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: allure-results-web
      - name: Check Hybrid artifact exists
        id: check_hybrid
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo });
            const found = artifacts.data.artifacts.some(a => a.name === 'allure-results-hybrid');
            core.setOutput('found', found ? 'true' : 'false');
      - name: Download Hybrid Allure results
        if: steps.check_hybrid.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: allure-results-hybrid
      - name: Merge Allure results
        run: |
          mkdir -p output/allure-results
          cp -R allure-results-api/* output/allure-results/ || true
          cp -R allure-results-web/* output/allure-results/ || true
          cp -R allure-results-hybrid/* output/allure-results/ || true
      - name: Generate Allure report
        run: npm run report
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: output/allure-report
